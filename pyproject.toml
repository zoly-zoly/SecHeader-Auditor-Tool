[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secheader-auditor"
version = "1.0.0"
description = "Asynchronous HTTP Security Header & CORS Compliance Auditing Tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "rich>=13.6.0",
]

[project.scripts]
secheader = "secheader.cli:app"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
